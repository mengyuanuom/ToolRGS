camera:
  type: realsense
  device: 0
  width: 1280
  height: 720
  fps: 30

robot:
  type: legacy_tcp
  enabled: true
  # The Kinova receiver runs in a Docker container with network_mode=host.
  # The GUI runs on the same host, so connect through loopback instead of
  # routing the old lab IP through the Wi-Fi gateway.
  host: 127.0.0.1
  port: 3000
  # Keep the GUI responsive when the Docker receiver is not listening.
  timeout_s: 2.0
  # Connect/arm on launch and send every valid
  # prediction automatically. The process still requires --allow-robot.
  auto_connect: true
  auto_arm: true
  auto_send: true
  auto_send_interval_s: 2.0
  default_depth: 0
  coordinate_space: source
  width_policy:
    # Send the DROG-OFF model prediction, already mapped to source-image pixels.
    type: model
  theta_policy:
    sign: 1.0
    offset_degrees: 180.0
    normalization: zero_360
  depth_policy:
    multiple_matches: max
    class_tiers: {}
  limits:
    x: [0, 1280]
    y: [0, 720]
    theta: [0, 360]
    width: [1, 600]
    depth: [-1, 1]

detector:
  type: mmdetection
  enabled: true
  config: configs/detection/faster_rcnn_r50_fpn_grasp_tools_v2_24e.py
  checkpoint: weights/faster_rcnn_r50_fpn_grasp_tools_v2_best.pth
  checkpoint_url: https://github.com/mengyuanuom/ToolRGS/releases/download/grasp-tools-v2-weights/faster_rcnn_r50_fpn_grasp_tools_v2_epoch24_best_map.pth
  checkpoint_sha256: 76a4a09164f5de1a410957f4439f801328cf543f28f34fa6fee24a7f7eb49e74
  # Trained on our 22-class Grasp-Tools V2 data and verified by SHA-256.
  trusted_checkpoint: true
  device: cuda:0
  score_threshold: 0.70
  nms_threshold: 0.50
  max_detections: 100
  inference_interval_ms: 400
  box_thickness: 2
  text_scale: 0.55

audio:
  type: whisper
  enabled: false

gelsight:
  type: classifier
  enabled: false

gui:
  title: ToolRGS Real-world Grasp Demo
  theme: Midnight Teal
  window_width: 1500
  window_height: 900
  camera_interval_ms: 33
  inference_interval_ms: 400
  continuous_inference: true
