    - T-hex key
    - L-hex key
    - marker
    - wrench
    - pliers
    - mallet
    - screwdriver
    - clamps
    - spool
    - sponge
    - clip
    - crimp tool
    - screw
    - tape
    - box
    - nut
    - ruler
    - file
    - stapler
    - scissors
    - cable
