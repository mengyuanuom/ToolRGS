# Copy this file to lab.yaml and change only local paths/IPs.
# The GUI can switch profiles without restarting the camera/robot layer.
active_model: drogoff-grasptools-v2
model_profiles:
  drogoff-grasptools-v2:
    config: config/grasp_tools/drogoff_v2.yaml
    checkpoint: weights/drogoff_grasp_tools_v2_best_j1.pth
    checkpoint_url: https://github.com/mengyuanuom/ToolRGS/releases/download/grasp-tools-v2-weights/drogoff_grasp_tools_v2_best_j1.pth
    checkpoint_sha256: 7fcef57dd968a381d61bab7ef35e5e3906149bcec9f4fdbb6658da23659e73d5
    device: cuda:0
    prompt: the screwdriver
    grasp_size_activation: auto
    mask_threshold: 0.35
    quality_threshold: 0.40
    num_grasps: 1
    postprocessor:
      type: dense_grasp
      min_distance: 2
      width_factor: 100.0
      grasp_height: 20.0
    gate_quality_by_mask: true
    scale_grasp_to_source: true
    overrides: {}
  crog-grasptools-v2:
    config: config/grasp_tools/crog.yaml
    checkpoint: weights/crog_grasp_tools_v2_best_j1.pth
    checkpoint_url: ""
    checkpoint_sha256: ""
    device: cuda:0
    prompt: the screwdriver
    grasp_size_activation: auto
    mask_threshold: 0.35
    quality_threshold: 0.40
    num_grasps: 1
    postprocessor:
      type: dense_grasp
      min_distance: 2
      width_factor: 100.0
      grasp_height: 20.0
    gate_quality_by_mask: true
    scale_grasp_to_source: true
    overrides: {}

camera:
  # image | opencv | video | realsense | gstreamer
  # No camera on Linux? Run:
  # python deploy_gui.py --config config/deployment/lab.yaml --image
  # Or set type: image and image_path to any JPG/PNG below.
  type: realsense
  device: 0
  width: 1280
  height: 720
  fps: 30
  image_path: assets/grasp_tools/graspall/000000000000.jpg
  video_path: assets/test_video.mp4
  gstreamer_pipeline: >-
    shmsrc socket-path=/path/to/fooA is-live=true do-timestamp=true !
    video/x-raw,format=BGR,width=1280,height=720,framerate=30/1 !
    queue leaky=downstream max-size-buffers=1 !
    appsink name=toolrgs_sink drop=true sync=false max-buffers=1

robot:
  type: legacy_tcp
  # Safe default. Change to true only after a dry-run and receiver/calibration check.
  enabled: false
  host: 192.168.38.10
  port: 3000
  timeout_s: 2.0
  auto_send: false
  auto_send_interval_s: 2.0
  default_depth: 0
  # source: original camera pixels; model: letterboxed input_size pixels.
  # This must match the calibration used by the external Kinova receiver.
  coordinate_space: source
  # model: send the neural-network width unchanged.
  # mask_span: reproduce the 22-class GUI's object-span + safety-margin rule.
  width_policy:
    type: mask_span
    step: 0.5
    safety_margin: 30.0
    maximum: 600
    exclude: [tape, cable]
  # Match the deployed RealSense GUI's `theta = theta + 180` wire convention.
  theta_policy:
    sign: 1.0
    offset_degrees: 180.0
    normalization: zero_360
  depth_policy:
    multiple_matches: max
    # Optional per-lab overrides, e.g. screwdriver: L2.
    class_tiers: {}
  # Required sender-side sanity bounds; update them for the calibrated stream.
  limits:
    x: [0, 1280]
    y: [0, 720]
    theta: [0, 360]
    width: [1, 600]
    depth: [-1, 1]

detector:
  type: mmdetection
  # Set true to create the Object detection tab in the GUI.
  enabled: false
  config: config/deployment/faster-rcnn-13.py
  checkpoint: weights/epoch_48_13.pth
  # Optional Release/HTTP download. Keep empty when the weight is copied manually.
  checkpoint_url: ""
  checkpoint_sha256: ""
  # Only enable for a checkpoint produced by your trusted training/server source.
  trusted_checkpoint: true
  device: cuda:0
  score_threshold: 0.70
  max_detections: 100
  inference_interval_ms: 400
  box_thickness: 2
  text_scale: 0.55
  classes:
    - box
    - clamps
    - clip
    - crimp tool
    - hex key
    - mallet
    - marker
    - screwdriver
    - sponge
    - spool
    - tape
    - tape measure
    - wrench
  palette:
    - [220, 20, 60]
    - [119, 11, 32]
    - [0, 0, 142]
    - [0, 0, 230]
    - [106, 0, 228]
    - [0, 60, 100]
    - [0, 80, 100]
    - [0, 0, 70]
    - [0, 0, 192]
    - [250, 170, 30]
    - [100, 170, 30]
    - [220, 220, 0]
    - [175, 116, 175]

audio:
  type: whisper
  enabled: false
  model: small
  device: cuda
  sample_rate: 16000
  duration_s: 4.0
  language: en

gelsight:
  type: classifier
  enabled: false
  checkpoint: weights/gelsight_best.pt
  device: cuda:0
  image_size: 320
  confidence_threshold: 0.90
  nothing_label: Nothing
  topk: 3
  mean: [0.428, 0.524, 0.580]
  std: [0.134, 0.057, 0.118]
  camera:
    type: opencv
    device: 6
    width: 480
    height: 480
    fps: 30

gui:
  title: ToolRGS Real-world Grasp Demo
  window_width: 1500
  window_height: 900
  camera_interval_ms: 33
  inference_interval_ms: 400
  continuous_inference: true
