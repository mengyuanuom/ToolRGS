# Minimal override example for the shared-memory stream used by the server CROG demo.
model:
  config: config/grasp_tools/drogoff.yaml
  checkpoint: exp/grasp_tools/drogoff_grasp_tools/best_jindex_model.pth
  device: cuda:0
  prompt: screwdriver

camera:
  type: gstreamer
  width: 1280
  height: 720
  fps: 30
  gstreamer_pipeline: >-
    shmsrc socket-path=/home/USER/kinova_rs_grasp/foo/fooA is-live=true do-timestamp=true !
    video/x-raw,format=BGR,width=1280,height=720,framerate=30/1 !
    queue leaky=downstream max-size-buffers=1 !
    appsink name=toolrgs_sink drop=true sync=false max-buffers=1

robot:
  type: legacy_tcp
  enabled: false
  host: 192.168.38.10
  port: 3000
  auto_send: false
  auto_send_interval_s: 2.0
  coordinate_space: source
  width_policy:
    type: mask_span
    step: 0.5
    safety_margin: 30.0
    maximum: 600
    exclude: [tape, cable]
  # Compatible with the historic server GUI's `theta = theta + 180` wire value.
  # Change to signed_90/0 only after the receiver calibration is updated.
  theta_policy:
    sign: 1.0
    offset_degrees: 180.0
    normalization: zero_360
  depth_policy:
    multiple_matches: max
    # The current GI server variant uses L2 for screwdriver.
    class_tiers:
      screwdriver: L2
  limits:
    x: [0, 1280]
    y: [0, 720]
    theta: [0, 360]
    width: [1, 600]
    depth: [-1, 1]

gelsight:
  type: classifier
  enabled: false
  checkpoint: weights/gelsight_best.pt
  device: cuda:0
  image_size: 320
  confidence_threshold: 0.90
  nothing_label: Nothing
  topk: 3
  mean: [0.428, 0.524, 0.580]
  std: [0.134, 0.057, 0.118]
  camera:
    type: opencv
    device: 0
    width: 480
    height: 480
    fps: 30
