_base_: ../../ocid_vlg/drogoff.yaml

# CUDA/GPU profile for Offset V2-guided grasp feature transport. The public
# architecture name remains "drogoff"; this extension is enabled only here.
DATA:
  dataset: OCID-VLG
  root_path: ./datasets/OCID-VLG
  with_depth: False
  grasp_size_factor: 100.0
  grasp_height: 20.0
  grasp_size_coordinate: original
  offset_version: v2
  offset_target_stride: 4
  offset_weight_floor: 0.25

MODEL:
  architecture: drogoff
  offset_head: lightweight
  offset_hidden_dim: 64
  offset_transport_enabled: True
  offset_transport_hidden_dim: 64
  offset_transport_max_displacement: 6.0
  offset_transport_confidence_floor: 0.1
  offset_transport_detach_confidence: True

TRAIN:
  sync_bn: False
  amp: False
  optimizer: adam
  optimizer_foreach: False
  pin_memory: True
  epochs: 50
  milestones: [35]
  # Global batch semantics: torchrun divides 24 evenly over eight GPUs.
  batch_size: 24
  batch_size_val: 24
  batch_size_is_global: True
  base_lr: 0.0001
  lr_decay: 0.1
  lr_multi: 1
  weight_decay: 0.0
  max_norm: 1.0
  exp_name: drogoff_transport_ocid_vlg_8gpu
  offset_loss_weight: 0.1
  save_freq: 0
  weight:
  resume:

Distributed:
  dist_backend: nccl

TEST:
  evaluation_protocol: crog_legacy
  offset_decode_mode: grasp_relative
  offset_resample_geometry: False
