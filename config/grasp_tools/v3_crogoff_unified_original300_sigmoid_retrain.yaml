_base_: crogoff.yaml

DATA:
  root_path: ./datasets/grasp-tools/aug_graspall_v3_15k
  grasp_size_factor: 300.0
  grasp_height: 20.0
  grasp_size_coordinate: original

TRAIN:
  amp: True
  optimizer: adam
  pin_memory: True
  workers: 4
  workers_val: 2
  epochs: 36
  milestones: [30]
  batch_size: 32
  batch_size_val: 32
  base_lr: 0.0001
  max_norm: 1.0
  print_freq: 100
  save_freq: 5
  save_epochs: [5, 10]
  val_start_epoch: 11
  val_freq: 1
  grasp_quality_loss_activation: sigmoid
  grasp_width_loss_activation: sigmoid
  exp_name: crogoff_grasp_tools_v3_15k_unified_original300_sigmoid
  weight:
  resume:

Distributed:
  dist_url: env://

TEST:
  evaluation_protocol: toolrgs
  test_batch_size: 32
  test_workers: 2
  grasp_quality_activation: sigmoid
  grasp_size_activation: sigmoid
  grasp_topk: [1, 5]
  grasp_iou_threshold: 0.25
  grasp_iou_thresholds: [0.25, 0.50, 0.75]
  grasp_angle_threshold: 30.0
  grasp_angle_thresholds: [5.0, 10.0, 20.0, 30.0]
  restore_grasp_size_scale: False
  filter_grasps_by_segmentation: False
  offset_resample_geometry: True
  visualize: False
