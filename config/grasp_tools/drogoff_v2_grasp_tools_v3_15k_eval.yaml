_base_: ./drogoff_v2_original_scale.yaml

# Exact standalone-evaluation profile reconstructed from the completed
# Grasp-Tools V3 DROG-OFF V2 experiment log.
DATA:
  root_path: ./datasets/grasp-tools/aug_graspall_v3_15k
  offset_version: v2
  offset_target_stride: 4
  offset_weight_floor: 0.25

MODEL:
  offset_head: lightweight
  offset_hidden_dim: 64

TRAIN:
  exp_name: drogoff_v2_grasp_tools_v3_15k_original300
  max_norm: 1.0

TEST:
  evaluation_protocol: crog_legacy
  grasp_iou_thresholds: [0.25, 0.5, 0.75]
  grasp_angle_thresholds: [5.0, 10.0, 20.0, 30.0]
  offset_decode_mode: grasp_relative
  offset_resample_geometry: False

