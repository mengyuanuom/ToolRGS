_base_: etrg_r50_rgb_grasp_tools_v3_15k_original_scale.yaml

TRAIN:
  # Fresh unified-V3 run. Quality and width use sigmoid in both training and
  # inference; geometry regression is restricted to labelled grasp pixels.
  grasp_quality_loss_activation: sigmoid
  grasp_width_loss_activation: sigmoid
  etrg_quality_positive_threshold: 0.05
  etrg_geometry_mask_threshold: 0.000001
  exp_name: etrg_r50_rgb_grasp_tools_v3_15k_unified_original300_sigmoid_masked
  weight:
  resume:

TEST:
  evaluation_protocol: toolrgs
  grasp_quality_activation: sigmoid
  grasp_size_activation: sigmoid
  grasp_topk: [1, 5]
  grasp_iou_threshold: 0.25
  grasp_angle_threshold: 30.0
  restore_grasp_size_scale: False
